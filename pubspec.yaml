name: neovibe
description: "NeoVibe — le réseau social de la présence physique."
publish_to: 'none'

# versionName+versionCode. À INCRÉMENTER à chaque release à tester : sans un
# versionCode plus élevé, Android refuse de mettre à jour un APK sideloadé (Jay
# est resté bloqué en v0.9.2 en croyant installer la v0.9.3). Convention :
# 0.9.4+94 → versionName 0.9.4, versionCode 94 (suffixe = version sans points).
version: 0.9.33+123

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # État & backend
  flutter_riverpod: ^3.0.0
  supabase_flutter: ^2.10.0

  # Capture & médias — la caméra est NATIVE (NativeCamera.kt + platform
  # channel), le plugin `camera` a été remplacé (chantier Jay 2026-07-13)
  image_picker: ^1.1.0
  video_player: ^2.9.0

  # Proximité BLE — le lien (advertising/scan/GATT) est NATIF (NativeBle.kt),
  # le protocole (poignée de main chiffrée, certificats) vit en Dart
  permission_handler: ^12.0.0
  flutter_foreground_task: ^9.1.0
  cryptography: ^2.7.0
  flutter_secure_storage: ^9.2.0

  # Notifications locales
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0

  intl: ^0.20.0
  shared_preferences: ^2.3.0
  path_provider: ^2.1.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
