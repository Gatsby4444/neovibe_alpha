# Domaine 10 — modération et administration (docs/serveur-rust.md, annexe A.9).
#
# Charles est administrateur (le seul, dans la copie). Les signalements sont
# posés par les situations : la copie n'en a aucun.
# - af9d1db5… : une Vibe de Charles livrée au bot 14 ;
# - 59a3046f… : une publication de Charles (2 faces) ;
# - S2 (88888888-…04) : une soirée ouverte de Charles, avec une affiche.

# ─── Signaler ──────────────────────────────────────────────────────────────

[[cas]]
nom = "signaler une Vibe reçue (la preuve est scellée)"
qui = "00000000-0000-4000-8000-000000000014"
rpc = "report_sent_vibe"
args = { p_card_id = "af9d1db5-40a8-4d79-aa40-62ef026465df", p_reason = "inappropriate", p_details = "  choquant  " }
doit_changer = ["public.card_reports", "public.moderation_holds"]

[[cas]]
nom = "signaler deux fois la même Vibe (rien de plus)"
qui = "00000000-0000-4000-8000-000000000014"
rpc = "report_sent_vibe"
args = { p_card_id = "af9d1db5-40a8-4d79-aa40-62ef026465df", p_reason = "other", p_details = "" }
avant = "insert into public.card_reports (card_id, author_id, reporter_id, reason) values ('af9d1db5-40a8-4d79-aa40-62ef026465df', '{{charles}}', '00000000-0000-4000-8000-000000000014', 'inappropriate')"

[[cas]]
nom = "signaler une Vibe qu'on ne m'a pas envoyée"
qui = "testeur"
rpc = "report_sent_vibe"
args = { p_card_id = "af9d1db5-40a8-4d79-aa40-62ef026465df", p_reason = "other", p_details = "x" }
attendu = "refuse"

[[cas]]
