args = { p_vibe_id = "66666666-0000-4000-8000-000000000030", p_reason = "harassment", p_details = "{{null}}" }
avant = """insert into public.library_vibes (id, conversation_id, author_id, reveal_at, placeholder_path, sealed_path, sealed_back_path, back_is_video) values ('66666666-0000-4000-8000-000000000030', 'ce573f65-3b61-4df1-995c-3cefc5620c64', '{{testeur}}', now(), '{{testeur}}/p.jpg', '{{testeur}}/s.bin', '{{testeur}}/sb.bin', true);
insert into public.library_vibe_keys (vibe_id, media_key) values ('66666666-0000-4000-8000-000000000030', 'cle')"""
doit_changer = ["public.library_vibe_reports", "public.moderation_holds"]

[[cas]]
