args = { p_card_id = "af9d1db5-40a8-4d79-aa40-62ef026465df", p_reason = "other", p_details = "x" }
avant = "insert into public.card_deliveries (card_id, recipient_id) values ('af9d1db5-40a8-4d79-aa40-62ef026465df', '{{charles}}')"
attendu = "refuse"

[[cas]]
nom = "signaler une Vibe d'un Drop"
qui = "charles"
