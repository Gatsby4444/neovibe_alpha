args = { p_vibe_id = "66666666-0000-4000-8000-000000000030", p_reason = "harassment", p_details = "x" }
avant = "insert into public.library_vibes (id, conversation_id, author_id, reveal_at, placeholder_path, sealed_path) values ('66666666-0000-4000-8000-000000000030', 'ce573f65-3b61-4df1-995c-3cefc5620c64', '{{testeur}}', now(), '{{testeur}}/p.jpg', '{{testeur}}/s.bin')"
