# Domaine 8 — les soirées (docs/serveur-rust.md, annexe A.7).
#
# Deux soirées posées par les situations (la copie de dev n'en a pas
# d'ouverte avec un lieu) :
# - S1 (88888888-…02, conversation …01) : la soirée PRIVÉE de Charles, à Paris
#   (48,8566 ; 2,3522, rayon 50 m), commencée il y a une heure ; Testeur y est
#   invité (membre simple) ;
# - S2 (88888888-…04, conversation …03) : la soirée OUVERTE de Charles, au même
#   endroit, jusqu'à dans deux heures ; Charles y est présent.
# Et dans la copie : le « moment » de Mimi (1e585520…, sans lieu, Mimi
# présente, Jay2 partie) ; la soirée terminée de Charles (350d19a0…).

# ─── Créer ─────────────────────────────────────────────────────────────────

[[cas]]
nom = "ouvrir une soirée là où je suis"
qui = "charles"
rpc = "create_open_event"
args = { p_title = "  Chez Paul  ", p_lat = 48.8566, p_lon = 2.3522, p_ends_at = "{{minutes+120}}", p_acc = 10.0 }
doit_changer = ["public.events", "public.conversations", "public.event_group_members", "public.conversation_members", "public.event_presences", "public.event_positions"]

[[cas]]
nom = "ouvrir une grande soirée"
qui = "charles"
rpc = "create_open_event"
args = { p_title = "Festival", p_lat = 48.8566, p_lon = 2.3522, p_ends_at = "{{minutes+600}}", p_radius_m = 120, p_acc = 10.0 }
doit_changer = ["public.events"]

[[cas]]
nom = "ouvrir une soirée avec une position imprécise"
qui = "charles"
rpc = "create_open_event"
args = { p_title = "Chez Paul", p_lat = 48.8566, p_lon = 2.3522, p_ends_at = "{{minutes+120}}", p_acc = 512.4 }
attendu = "refuse"

[[cas]]
nom = "ouvrir une soirée sans précision de position"
qui = "charles"
rpc = "create_open_event"
args = { p_title = "Chez Paul", p_lat = 48.8566, p_lon = 2.3522, p_ends_at = "{{minutes+120}}" }
attendu = "refuse"

[[cas]]
nom = "ouvrir une soirée déjà finie"
qui = "charles"
rpc = "create_open_event"
args = { p_title = "Chez Paul", p_lat = 48.8566, p_lon = 2.3522, p_ends_at = "{{minutes-5}}", p_acc = 10.0 }
attendu = "refuse"

[[cas]]
nom = "ouvrir une soirée de plus de 24 h"
qui = "charles"
rpc = "create_open_event"
args = { p_title = "Chez Paul", p_lat = 48.8566, p_lon = 2.3522, p_ends_at = "{{minutes+1500}}", p_acc = 10.0 }
attendu = "refuse"

[[cas]]
nom = "ouvrir une soirée d'une taille inconnue"
qui = "charles"
rpc = "create_open_event"
args = { p_title = "Chez Paul", p_lat = 48.8566, p_lon = 2.3522, p_ends_at = "{{minutes+120}}", p_radius_m = 77, p_acc = 10.0 }
attendu = "refuse"

[[cas]]
nom = "ouvrir une soirée sans nom"
qui = "charles"
rpc = "create_open_event"
args = { p_title = "   ", p_lat = 48.8566, p_lon = 2.3522, p_ends_at = "{{minutes+120}}", p_acc = 10.0 }
attendu = "refuse"

[[cas]]
nom = "ouvrir une soirée en étant suspendu"
qui = "charles"
rpc = "create_open_event"
args = { p_title = "Chez Paul", p_lat = 48.8566, p_lon = 2.3522, p_ends_at = "{{minutes+120}}", p_acc = 10.0 }
avant = "update public.profiles set suspended_at = now() where id = '{{charles}}'"
attendu = "refuse"

[[cas]]
nom = "ouvrir une soirée depuis un moment (on en sort)"
qui = "mimi"
rpc = "create_open_event"
args = { p_title = "On bouge", p_lat = 48.8566, p_lon = 2.3522, p_ends_at = "{{minutes+120}}", p_acc = 10.0 }
doit_changer = ["public.events", "public.event_presences"]

[[cas]]
nom = "créer une soirée privée, en invitant des amis (et un inconnu)"
qui = "charles"
rpc = "create_private_event"
args = { p_title = "Anniversaire", p_member_ids = ["{{testeur}}", "{{yanis}}", "{{charles}}", "{{mimi}}"] }
doit_changer = ["public.events", "public.conversations", "public.event_group_members", "public.conversation_members"]

[[cas]]
nom = "créer une soirée privée avec un lieu, plus tard"
qui = "charles"
rpc = "create_private_event"
args = { p_title = "Dîner", p_starts_at = "{{minutes+60}}", p_ends_at = "{{minutes+240}}", p_lat = 48.8566, p_lon = 2.3522, p_acc = 20.0 }
doit_changer = ["public.events"]

[[cas]]
nom = "créer une soirée privée avec un lieu imprécis"
qui = "charles"
rpc = "create_private_event"
args = { p_title = "Dîner", p_lat = 48.8566, p_lon = 2.3522, p_acc = 150.0 }
attendu = "refuse"

