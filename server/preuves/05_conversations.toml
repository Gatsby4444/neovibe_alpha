# Domaine 5 — les conversations (docs/serveur-rust.md, annexe A.4).
# ce573f65… : la conversation directe de Charles et Testeur.
# 2673ff29… : le chat d'une soirée TERMINÉE où Charles est (cas 1 de l'audit).

[[cas]]
nom = "écrire un texte dans une conversation directe"
qui = "charles"
op = "message_send"
args = { conversation_id = "ce573f65-3b61-4df1-995c-3cefc5620c64", sender_id = "{{charles}}", kind = "text", body = "bonjour" }
ancien = "insert into public.messages (conversation_id, sender_id, kind, body) values ('ce573f65-3b61-4df1-995c-3cefc5620c64', '{{charles}}', 'text', 'bonjour')"
ancien_resultat = "select to_json(m) from public.messages m where m.body = 'bonjour' and m.conversation_id = 'ce573f65-3b61-4df1-995c-3cefc5620c64' order by created_at desc limit 1"
doit_changer = ["public.messages", "public.conversation_participation"]

