qui = "testeur"
op = "conversations_list"
ancien_resultat = "select coalesce(json_agg(t order by t.created_at desc), '[]') from (select c.*, (select coalesce(json_agg(json_build_object('profiles', (select to_json(p) from public.profiles p where p.id = cm.user_id))), '[]') from public.conversation_members cm where cm.conversation_id = c.id) as members from public.conversations c) t"
ecart = "la suspension d'un autre compte ne se lit plus"
ecart_champs = ["suspended_at", "suspended_reason"]

