[[cas]]
nom = "le canal de proximité : du texte seulement"
qui = "charles"
op = "message_send"
args = { conversation_id = "66666666-6666-4666-8666-666666666666", sender_id = "{{charles}}", kind = "image", media_path = "{{charles}}/x.jpg" }
avant = """insert into public.conversations (id, conversation_type, pair_key, created_by) values ('66666666-6666-4666-8666-666666666666', 'proximity', 'prox:test', '{{charles}}');
insert into public.conversation_members (conversation_id, user_id) values ('66666666-6666-4666-8666-666666666666', '{{charles}}'), ('66666666-6666-4666-8666-666666666666', '{{jay2}}');
insert into public.ping_pairs (user_low, user_high) values (least('{{charles}}'::uuid, '{{jay2}}'::uuid), greatest('{{charles}}'::uuid, '{{jay2}}'::uuid)) on conflict (user_low, user_high) do update set last_seen_at = now()"""
ancien = "insert into public.messages (conversation_id, sender_id, kind, media_path) values ('66666666-6666-4666-8666-666666666666', '{{charles}}', 'image', '{{charles}}/x.jpg')"
attendu = "refuse"

[[cas]]
nom = "le canal de proximité : 3 messages sans réponse, pas un de plus"
qui = "charles"
op = "message_send"
args = { conversation_id = "66666666-6666-4666-8666-666666666666", sender_id = "{{charles}}", kind = "text", body = "4e" }
avant = """insert into public.conversations (id, conversation_type, pair_key, created_by) values ('66666666-6666-4666-8666-666666666666', 'proximity', 'prox:test', '{{charles}}');
insert into public.conversation_members (conversation_id, user_id) values ('66666666-6666-4666-8666-666666666666', '{{charles}}'), ('66666666-6666-4666-8666-666666666666', '{{jay2}}');
insert into public.ping_pairs (user_low, user_high) values (least('{{charles}}'::uuid, '{{jay2}}'::uuid), greatest('{{charles}}'::uuid, '{{jay2}}'::uuid)) on conflict (user_low, user_high) do update set last_seen_at = now();
insert into public.messages (conversation_id, sender_id, kind, body) values ('66666666-6666-4666-8666-666666666666', '{{charles}}', 'text', '1'), ('66666666-6666-4666-8666-666666666666', '{{charles}}', 'text', '2'), ('66666666-6666-4666-8666-666666666666', '{{charles}}', 'text', '3')"""
ancien = "insert into public.messages (conversation_id, sender_id, kind, body) values ('66666666-6666-4666-8666-666666666666', '{{charles}}', 'text', '4e')"
attendu = "refuse"

[[cas]]
nom = "le canal de proximité fermé 3 minutes après le dernier ping"
qui = "charles"
op = "message_send"
args = { conversation_id = "66666666-6666-4666-8666-666666666666", sender_id = "{{charles}}", kind = "text", body = "trop tard" }
avant = """insert into public.conversations (id, conversation_type, pair_key, created_by) values ('66666666-6666-4666-8666-666666666666', 'proximity', 'prox:test', '{{charles}}');
insert into public.conversation_members (conversation_id, user_id) values ('66666666-6666-4666-8666-666666666666', '{{charles}}'), ('66666666-6666-4666-8666-666666666666', '{{jay2}}');
delete from public.ping_pairs where user_low = least('{{charles}}'::uuid, '{{jay2}}'::uuid) and user_high = greatest('{{charles}}'::uuid, '{{jay2}}'::uuid)"""
ancien = "insert into public.messages (conversation_id, sender_id, kind, body) values ('66666666-6666-4666-8666-666666666666', '{{charles}}', 'text', 'trop tard')"
attendu = "refuse"

