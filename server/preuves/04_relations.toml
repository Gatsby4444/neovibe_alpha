# ─── Les croisements ───────────────────────────────────────────────────

[[cas]]
nom = "deux amis se reconnaissent : croisement, jour de rencontre, palier recalculé"
doit_changer = ["public.sightings", "public.encounters", "public.meeting_days", "public.connections"]
qui = "charles"
rpc = "report_sightings"
args = { items = [{ peer = "{{testeur}}", slot = "{{creneau}}", band = "proche" }] }
avant = "delete from public.meeting_days where user_low = least('{{charles}}'::uuid, '{{testeur}}'::uuid) and user_high = greatest('{{charles}}'::uuid, '{{testeur}}'::uuid) and day = (now() at time zone 'utc')::date; insert into public.sightings (observer_id, seen_id, slot, band) values ('{{testeur}}', '{{charles}}', {{creneau}}, 'proche')"

[[cas]]
nom = "une vue sans réciproque : notée, pas de croisement"
qui = "charles"
rpc = "report_sightings"
args = { items = [{ peer = "{{testeur}}", slot = "{{creneau}}" }] }

[[cas]]
nom = "deux inconnus présents à la même soirée : croisement en soirée et rencontre"
doit_changer = ["public.event_sightings", "public.event_crossings", "public.meetings", "public.event_presences"]
qui = "bot01"
rpc = "report_sightings"
args = { items = [{ peer = "{{bot02}}", slot = "{{creneau}}" }] }
avant = """insert into public.event_presences (event_id, user_id) values ('1e585520-6edb-4aa3-a231-9ed749cd0aa5', '{{bot01}}'), ('1e585520-6edb-4aa3-a231-9ed749cd0aa5', '{{bot02}}');
insert into public.event_sightings (event_id, observer_id, seen_id, slot) values ('1e585520-6edb-4aa3-a231-9ed749cd0aa5', '{{bot02}}', '{{bot01}}', {{creneau}})"""

[[cas]]
nom = "des vues illisibles ou hors fenêtre sont ignorées"
qui = "charles"
rpc = "report_sightings"
args = { items = [{ peer = "{{charles}}", slot = "{{creneau}}" }, { slot = "{{creneau}}" }, { peer = "{{testeur}}", slot = "{{creneau-400}}" }] }

[[cas]]
nom = "un identifiant illisible fait échouer l'envoi"
qui = "charles"
rpc = "report_sightings"
args = { items = [{ peer = "pas-un-id", slot = 1 }] }
attendu = "refuse"

[[cas]]
nom = "ceux croisés récemment (ping et soirée)"
qui = "charles"
rpc = "crossed_recently"
avant = """insert into public.ping_pairs (user_low, user_high) values (least('{{charles}}'::uuid, '{{jay2}}'::uuid), greatest('{{charles}}'::uuid, '{{jay2}}'::uuid)) on conflict (user_low, user_high) do update set last_seen_at = now();
insert into public.event_crossings (event_id, event_title, user_low, user_high, first_at, last_at, source) values ('1e585520-6edb-4aa3-a231-9ed749cd0aa5', 'Une soirée', least('{{charles}}'::uuid, '{{bot01}}'::uuid), greatest('{{charles}}'::uuid, '{{bot01}}'::uuid), now(), now(), 'ping');
insert into public.connection_requests (sender_id, receiver_id, status, expires_at) values ('{{charles}}', '{{jay2}}', 'pending', now() + interval '1 day')"""

