# ─── Les blocages ─────────────────────────────────────────────────────

[[cas]]
nom = "bloquer un ami : tout ce qui nous reliait tombe"
doit_changer = ["public.blocks", "public.connections", "public.encounters", "public.sightings", "public.connection_requests", "public.ping_confirmations"]
qui = "charles"
rpc = "block_user"
args = { p_user_id = "{{testeur}}" }
avant = """insert into public.encounters (user_low, user_high) values (least('{{charles}}'::uuid, '{{testeur}}'::uuid), greatest('{{charles}}'::uuid, '{{testeur}}'::uuid)) on conflict do nothing;
insert into public.sightings (observer_id, seen_id, slot) values ('{{charles}}', '{{testeur}}', 1), ('{{testeur}}', '{{charles}}', 1);
insert into public.connection_requests (sender_id, receiver_id, status, expires_at) values ('{{testeur}}', '{{charles}}', 'declined', now());
insert into public.ping_confirmations (observer_id, subject_id, slot) values ('{{charles}}', '{{testeur}}', 1)"""
attendu = "accepte"

[[cas]]
nom = "se bloquer soi-même"
qui = "charles"
rpc = "block_user"
args = { p_user_id = "{{charles}}" }
attendu = "refuse"

[[cas]]
nom = "débloquer"
qui = "charles"
rpc = "unblock_user"
args = { p_user_id = "{{jay2}}" }
avant = "insert into public.blocks (blocker_id, blocked_id) values ('{{charles}}', '{{jay2}}')"

