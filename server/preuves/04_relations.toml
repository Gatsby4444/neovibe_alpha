# Domaine 4 — relations et proximité (docs/serveur-rust.md, annexe A.3).
# Charles et Testeur sont amis ; Charles et Jay2 ne le sont pas.

# ─── Le ping ────────────────────────────────────────────────────────────

[[cas]]
nom = "publier ma balise"
qui = "charles"
rpc = "publish_ping_beacon"
args = { p_lat = 50.6368, p_lon = 3.0708, p_token = "jeton-c", p_slot = "{{creneau}}", p_acc = 12.5 }
attendu = "accepte"

[[cas]]
nom = "publier ma balise en partageant ma position (la position des amis suit)"
doit_changer = ["public.ping_beacons", "public.friend_locations"]
qui = "charles"
rpc = "publish_ping_beacon"
args = { p_lat = 50.6368, p_lon = 3.0708, p_token = "jeton-c", p_slot = "{{creneau}}" }
avant = "insert into public.location_sharing (user_id, sharing) values ('{{charles}}', true) on conflict (user_id) do update set sharing = true; delete from public.friend_locations where user_id = '{{charles}}'"

[[cas]]
nom = "publier une balise hors des bornes du monde"
qui = "charles"
rpc = "publish_ping_beacon"
args = { p_lat = 91.0, p_lon = 3.0, p_token = "x", p_slot = "{{creneau}}" }
attendu = "refuse"

[[cas]]
nom = "publier une balise sans jeton"
qui = "charles"
rpc = "publish_ping_beacon"
args = { p_lat = 50.0, p_lon = 3.0, p_token = "", p_slot = "{{creneau}}" }
attendu = "refuse"

[[cas]]
nom = "retirer ma balise"
qui = "charles"
rpc = "retire_ping_beacon"
avant = "insert into public.ping_beacons (user_id, cell_lat, cell_lon, token, slot, lat, lon) values ('{{charles}}', 5063, 307, 'jeton-c', {{creneau}}, 50.63, 3.07) on conflict (user_id) do update set cell_lat = excluded.cell_lat, cell_lon = excluded.cell_lon, token = excluded.token, slot = excluded.slot, lat = excluded.lat, lon = excluded.lon, updated_at = now()"

[[cas]]
nom = "confirmer un jeton entendu (sans miroir : pas encore de paire)"
qui = "charles"
rpc = "confirm_ping"
args = { p_tokens = ["jeton-j"], p_slot = "{{creneau}}" }
avant = """insert into public.ping_beacons (user_id, cell_lat, cell_lon, token, slot, lat, lon) values
  ('{{charles}}', 5063, 307, 'jeton-c', {{creneau}}, 50.63, 3.07),
  ('{{jay2}}', 5063, 308, 'jeton-j', {{creneau}}, 50.63, 3.08) on conflict (user_id) do update set cell_lat = excluded.cell_lat, cell_lon = excluded.cell_lon, token = excluded.token, slot = excluded.slot, lat = excluded.lat, lon = excluded.lon, updated_at = now()"""

[[cas]]
nom = "confirmer avec le miroir : la paire NAÎT, la rencontre se note des deux côtés"
doit_changer = ["public.ping_pairs", "public.meetings", "public.ping_confirmations"]
qui = "charles"
rpc = "confirm_ping"
args = { p_tokens = ["jeton-j", "jeton-inconnu"], p_slot = "{{creneau}}" }
avant = """delete from public.ping_pairs where user_low = least('{{charles}}'::uuid, '{{jay2}}'::uuid) and user_high = greatest('{{charles}}'::uuid, '{{jay2}}'::uuid);
insert into public.ping_beacons (user_id, cell_lat, cell_lon, token, slot, lat, lon) values
  ('{{charles}}', 5063, 307, 'jeton-c', {{creneau}}, 50.63, 3.07),
  ('{{jay2}}', 5063, 308, 'jeton-j', {{creneau}}, 50.63, 3.08) on conflict (user_id) do update set cell_lat = excluded.cell_lat, cell_lon = excluded.cell_lon, token = excluded.token, slot = excluded.slot, lat = excluded.lat, lon = excluded.lon, updated_at = now();
insert into public.ping_confirmations (observer_id, subject_id, slot) values ('{{jay2}}', '{{charles}}', {{creneau}})"""

[[cas]]
nom = "confirmer une paire qui existe déjà (elle se revoit, pas de nouvelle rencontre)"
doit_changer = ["public.ping_pairs"]
qui = "charles"
rpc = "confirm_ping"
args = { p_tokens = ["jeton-j"], p_slot = "{{creneau}}" }
avant = """insert into public.ping_beacons (user_id, cell_lat, cell_lon, token, slot, lat, lon) values
  ('{{charles}}', 5063, 307, 'jeton-c', {{creneau}}, 50.63, 3.07),
  ('{{jay2}}', 5063, 308, 'jeton-j', {{creneau}}, 50.63, 3.08) on conflict (user_id) do update set cell_lat = excluded.cell_lat, cell_lon = excluded.cell_lon, token = excluded.token, slot = excluded.slot, lat = excluded.lat, lon = excluded.lon, updated_at = now();
insert into public.ping_confirmations (observer_id, subject_id, slot) values ('{{jay2}}', '{{charles}}', {{creneau}});
insert into public.ping_pairs (user_low, user_high, first_seen_at, last_seen_at) values (least('{{charles}}'::uuid, '{{jay2}}'::uuid), greatest('{{charles}}'::uuid, '{{jay2}}'::uuid), now() - interval '1 hour', now() - interval '1 hour') on conflict do nothing"""

