# ─── Ce que l'app faisait directement sur les tables ──────────────────

[[cas]]
nom = "publier ma clé de reconnaissance"
qui = "charles"
op = "device_key_upsert"
args = { user_id = "{{charles}}", x25519_pub = "clé-publique-de-preuve" }
ancien = "insert into public.device_keys (user_id, x25519_pub) values ('{{charles}}', 'clé-publique-de-preuve') on conflict (user_id) do update set x25519_pub = excluded.x25519_pub"
attendu = "accepte"

[[cas]]
nom = "publier la clé d'un autre"
qui = "charles"
op = "device_key_upsert"
args = { user_id = "{{testeur}}", x25519_pub = "usurpée" }
ancien = "insert into public.device_keys (user_id, x25519_pub) values ('{{testeur}}', 'usurpée') on conflict (user_id) do update set x25519_pub = excluded.x25519_pub"
attendu = "refuse"

[[cas]]
nom = "le carnet des clés que je peux reconnaître"
qui = "charles"
op = "key_book_list"
avant = "insert into public.device_keys (user_id, x25519_pub) values ('{{testeur}}', 'k-testeur'), ('{{jay2}}', 'k-jay2'), ('{{charles}}', 'k-moi') on conflict (user_id) do update set x25519_pub = excluded.x25519_pub"
ancien_resultat = "select coalesce(json_agg(t), '[]') from (select * from public.key_book) t"
sans_ordre = true

[[cas]]
nom = "retirer un ami (et ce qui dérivait du lien)"
doit_changer = ["public.connections", "public.encounters", "public.sightings"]
qui = "charles"
op = "connection_delete"
args = { id = "55555555-5555-4555-8555-555555555555" }
avant = """update public.connections set id = '55555555-5555-4555-8555-555555555555' where user_low = least('{{charles}}'::uuid, '{{testeur}}'::uuid) and user_high = greatest('{{charles}}'::uuid, '{{testeur}}'::uuid);
insert into public.encounters (user_low, user_high) values (least('{{charles}}'::uuid, '{{testeur}}'::uuid), greatest('{{charles}}'::uuid, '{{testeur}}'::uuid)) on conflict do nothing;
insert into public.sightings (observer_id, seen_id, slot) values ('{{testeur}}', '{{charles}}', 1)"""
ancien = "delete from public.connections where id = '55555555-5555-4555-8555-555555555555'"

[[cas]]
nom = "retirer le lien de deux autres : sans effet"
qui = "jay2"
op = "connection_delete"
args = { id = "55555555-5555-4555-8555-555555555555" }
avant = "update public.connections set id = '55555555-5555-4555-8555-555555555555' where user_low = least('{{charles}}'::uuid, '{{testeur}}'::uuid) and user_high = greatest('{{charles}}'::uuid, '{{testeur}}'::uuid)"
ancien = "delete from public.connections where id = '55555555-5555-4555-8555-555555555555'"

[[cas]]
nom = "l'historique de mes demandes"
qui = "charles"
op = "connection_requests_history"
avant = "insert into public.connection_requests (sender_id, receiver_id, status, expires_at, created_at) values ('{{charles}}', '{{jay2}}', 'pending', now() + interval '1 day', now() - interval '1 hour'), ('{{bot01}}', '{{charles}}', 'declined', now(), now() - interval '2 hours')"
ancien_resultat = "select coalesce(json_agg(t), '[]') from (select * from public.connection_requests order by created_at desc limit 50) t"

[[cas]]
nom = "les recommandations que j'ai demandées (avec les profils)"
qui = "testeur"
op = "recommendations_list"
args = { p_role = "requester" }
avant = "insert into public.recommendations (requester_id, intermediary_id, target_hint, status, expires_at, created_at) values ('{{testeur}}', '{{charles}}', 'un', 'requested', now() + interval '7 days', now() - interval '1 hour'), ('{{testeur}}', '{{charles}}', 'deux', 'forwarded', now() + interval '7 days', now())"
ancien_resultat = "select coalesce(json_agg(t), '[]') from (select r.*, to_json(rq) as requester, to_json(it) as intermediary, to_json(tg) as target from public.recommendations r left join public.profiles rq on rq.id = r.requester_id left join public.profiles it on it.id = r.intermediary_id left join public.profiles tg on tg.id = r.target_id where r.requester_id = '{{testeur}}' order by r.created_at desc) t"
ecart = "la suspension d'un autre compte ne se lit plus"
ecart_champs = ["suspended_at", "suspended_reason"]

[[cas]]
nom = "les recommandations à transmettre (intermédiaire)"
qui = "charles"
op = "recommendations_list"
args = { p_role = "intermediary" }
avant = "insert into public.recommendations (requester_id, intermediary_id, target_hint, status, expires_at) values ('{{testeur}}', '{{charles}}', 'un', 'requested', now() + interval '7 days')"
ancien_resultat = "select coalesce(json_agg(t), '[]') from (select r.*, to_json(rq) as requester, to_json(it) as intermediary, to_json(tg) as target from public.recommendations r left join public.profiles rq on rq.id = r.requester_id left join public.profiles it on it.id = r.intermediary_id left join public.profiles tg on tg.id = r.target_id where r.intermediary_id = '{{charles}}' and r.status = 'requested' order by r.created_at desc) t"
ecart = "la suspension d'un autre compte ne se lit plus"
ecart_champs = ["suspended_at", "suspended_reason"]

[[cas]]
nom = "demander une mise en relation à un ami"
qui = "testeur"
op = "recommendation_create"
args = { requester_id = "{{testeur}}", intermediary_id = "{{charles}}", target_hint = "une personne du club" }
ancien = "insert into public.recommendations (requester_id, intermediary_id, target_hint) values ('{{testeur}}', '{{charles}}', 'une personne du club')"
attendu = "accepte"

[[cas]]
nom = "demander une mise en relation à un non-ami"
qui = "jay2"
op = "recommendation_create"
args = { requester_id = "{{jay2}}", intermediary_id = "{{charles}}", target_hint = "x" }
ancien = "insert into public.recommendations (requester_id, intermediary_id, target_hint) values ('{{jay2}}', '{{charles}}', 'x')"
attendu = "refuse"

[[cas]]
nom = "ceux que j'ai bloqués, avec leur profil"
qui = "charles"
op = "blocks_list"
avant = "insert into public.blocks (blocker_id, blocked_id, created_at) values ('{{charles}}', '{{jay2}}', now() - interval '1 hour'), ('{{charles}}', '{{bot01}}', now())"
ancien_resultat = "select coalesce(json_agg(t), '[]') from (select b.blocked_id, to_json(p) as profiles from public.blocks b left join public.profiles p on p.id = b.blocked_id where b.blocker_id = '{{charles}}' order by b.created_at desc) t"
ecart = "la suspension d'un autre compte ne se lit plus"
ecart_champs = ["suspended_at", "suspended_reason"]

[[cas]]
nom = "mes saluts à montrer"
qui = "charles"
op = "waves_list"
avant = "insert into public.waves (user_id, peer_id, detected_at, notify_after) values ('{{charles}}', '{{testeur}}', now() - interval '1 hour', now() - interval '1 hour'), ('{{charles}}', '{{mimi}}', now(), now() + interval '1 hour')"
ancien_resultat = "select coalesce(json_agg(t), '[]') from (select * from public.waves where user_id = '{{charles}}' and notify_after <= now() order by detected_at desc limit 50) t"

