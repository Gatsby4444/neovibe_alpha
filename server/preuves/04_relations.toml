[[cas]]
nom = "saluer en étant suspendu"
qui = "charles"
op = "wave_insert"
args = { user_id = "{{charles}}", peer_id = "{{testeur}}" }
avant = "update public.profiles set suspended_at = now() where id = '{{charles}}'"
ancien = "insert into public.waves (user_id, peer_id) values ('{{charles}}', '{{testeur}}')"
attendu = "refuse"
