# ─── Déposer ─────────────────────────────────────────────────────────────

[[cas]]
nom = "déposer dans mon dossier"
qui = "charles"
op = "files_sign_upload"
args = { bucket = "cards", path = "{{charles}}/nouvelle_front.jpg", content_type = "application/octet-stream", size = 1000, upsert = true }
ancien = "insert into storage.objects (bucket_id, name, owner) values ('cards', '{{charles}}/nouvelle_front.jpg', '{{charles}}')"
ancien_resultat = "select json_build_object('url', '<lien>', 'method', 'PUT', 'headers', json_build_object('content-type', 'application/octet-stream', 'content-length', '1000'))"
ignorer = ["storage.objects"]
attendu = "accepte"

