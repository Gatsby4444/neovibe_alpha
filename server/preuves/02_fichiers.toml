avant = "insert into public.moderation_holds (report_kind, report_id, bucket_id, object_name, rang) values ('content', gen_random_uuid(), 'avatars', '{{mimi}}/avatar_1786878437570.png', 1)"
ancien_resultat = "with d as (delete from storage.objects where bucket_id = 'avatars' and name = '{{mimi}}/avatar_1786878437570.png' returning name) select coalesce(json_agg(json_build_object('name', name)), '[]') from d"
