# ─── Le ménage fait par l'app ────────────────────────────────────────────

[[cas]]
nom = "mes_octets_a_supprimer : les fichiers en attente d'effacement"
qui = "charles"
rpc = "mes_octets_a_supprimer"
sans_ordre = true
avant = "update public.storage_tombstones set delete_after = now() - interval '1 day' where owner_id = '{{charles}}'"

[[cas]]
nom = "octets_supprimes : l'app confirme"
qui = "charles"
rpc = "octets_supprimes"
args = { p_bucket = "library", p_names = ["{{charles}}/inexistant.jpg"] }
avant = "insert into public.storage_tombstones (bucket_id, object_name, owner_id, delete_after) values ('library', '{{charles}}/inexistant.jpg', '{{charles}}', now())"
