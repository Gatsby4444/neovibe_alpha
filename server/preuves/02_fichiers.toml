# Domaine 2 — les fichiers (docs/serveur-rust.md, annexe A.2).
#
# L'ancien côté : les politiques du stockage, jouées sur `storage.objects`
# sous l'identité du compte (lire = la ligne est visible ; déposer = la ligne
# s'insère ; supprimer = la ligne s'efface). Le nouveau côté : les guichets,
# avec un entrepôt factice qui rend « <lien> ». On compare les DROITS.
# La table `storage.objects` n'existe plus côté Rust : ses changements ne se
# comparent pas.

# ─── Lire ────────────────────────────────────────────────────────────────

[[cas]]
nom = "lire une Vibe reçue (carte)"
qui = "charles"
op = "files_sign_read"
args = { bucket = "cards", paths = ["{{lea}}/msrypuqd_0_front.jpg", "{{lea}}/msrypuqd_1_front.mp4"], expires_in = 3600 }
ancien_resultat = """select json_agg(json_build_object('path', x.p,
  'signedUrl', case when exists (select 1 from storage.objects o where o.bucket_id = 'cards' and o.name = x.p) then '<lien>' end,
  'error', case when exists (select 1 from storage.objects o where o.bucket_id = 'cards' and o.name = x.p) then null else 'Fichier introuvable ou non autorisé' end) order by x.n)
  from (values (1, '{{lea}}/msrypuqd_0_front.jpg'), (2, '{{lea}}/msrypuqd_1_front.mp4')) x(n, p)"""

