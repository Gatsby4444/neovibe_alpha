# ─── Supprimer ───────────────────────────────────────────────────────────

[[cas]]
nom = "supprimer mes fichiers (et ignorer celui d'un autre)"
qui = "lea"
op = "files_remove"
args = { bucket = "cards", paths = ["{{lea}}/msrypuqd_0_front.jpg", "{{charles}}/0cf347cb-88be-4cc3-b808-90541c650287_back.jpg"] }
ancien_resultat = "with d as (delete from storage.objects where bucket_id = 'cards' and name = any(array['{{lea}}/msrypuqd_0_front.jpg', '{{charles}}/0cf347cb-88be-4cc3-b808-90541c650287_back.jpg']) returning name) select coalesce(json_agg(json_build_object('name', name)), '[]') from d"
ignorer = ["storage.objects"]

[[cas]]
nom = "supprimer un fichier retenu par la modération : non"
qui = "lea"
op = "files_remove"
args = { bucket = "cards", paths = ["{{lea}}/msrypuqd_0_front.jpg"] }
avant = "insert into public.moderation_holds (report_kind, report_id, bucket_id, object_name, rang) values ('content', gen_random_uuid(), 'cards', '{{lea}}/msrypuqd_0_front.jpg', 1)"
ancien_resultat = "with d as (delete from storage.objects where bucket_id = 'cards' and name = '{{lea}}/msrypuqd_0_front.jpg' returning name) select coalesce(json_agg(json_build_object('name', name)), '[]') from d"
ignorer = ["storage.objects"]

[[cas]]
nom = "supprimer ma photo de profil (même retenue : l'ancienne règle ne la retenait pas)"
