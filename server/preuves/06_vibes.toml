# Domaine 6 — Vibes et contenus (docs/serveur-rust.md, annexe A.6).
#
# Données de la copie de dev :
# - af9d1db5… : une Vibe de Charles (vues illimitées) livrée au bot 14
#   (livraison 67407afb…) ; 89fb3c15… : une Vibe de Charles jamais livrée ;
#   8b457956… : une Vibe de Charles livrée à cinq bots ;
# - 59a3046f… : une publication de Charles (non partageable), 26e067e4… : une
#   autre (partageable) ; 07a67541… : une publication de Sofia, que Charles a
#   aimée mais ne peut plus voir ; 2e3ebac7… : une publication de Charles
#   aimée une fois ;
# - ce573f65… : la conversation directe Charles–Testeur ; 35fad5e5… : Charles–Mimi ;
# - 2673ff29… : le Drop de la soirée TERMINÉE de Charles ; 6a69f92a… : le Drop
#   de la soirée privée ouverte de Mimi (Mimi présente, Jay2 partie).
# Yanis ne voit rien de Charles (ni ami, ni croisé).

