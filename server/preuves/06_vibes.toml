[[cas]]
nom = "envoyer une Vibe avec une demande d'ami à quelqu'un croisé"
qui = "charles"
rpc = "request_connection_with_vibe"
args = { peer = "{{yanis}}", p_card_id = "89fb3c15-a103-4b9c-b8b8-d872c7c1b8dc" }
avant = "insert into public.ping_pairs (user_low, user_high) values (least('{{charles}}'::uuid, '{{yanis}}'::uuid), greatest('{{charles}}'::uuid, '{{yanis}}'::uuid)) on conflict (user_low, user_high) do update set last_seen_at = now()"
doit_changer = ["public.connection_requests", "public.card_deliveries"]

[[cas]]
nom = "joindre une Vibe à une demande déjà en attente"
qui = "charles"
rpc = "request_connection_with_vibe"
args = { peer = "{{yanis}}", p_card_id = "89fb3c15-a103-4b9c-b8b8-d872c7c1b8dc" }
avant = """insert into public.ping_pairs (user_low, user_high) values (least('{{charles}}'::uuid, '{{yanis}}'::uuid), greatest('{{charles}}'::uuid, '{{yanis}}'::uuid)) on conflict (user_low, user_high) do update set last_seen_at = now();
insert into public.connection_requests (sender_id, receiver_id, status, expires_at) values ('{{charles}}', '{{yanis}}', 'pending', now() + interval '7 days')"""
doit_changer = ["public.connection_requests", "public.card_deliveries"]

[[cas]]
nom = "suspendu : joindre une Vibe à une demande déjà en attente"
qui = "charles"
rpc = "request_connection_with_vibe"
args = { peer = "{{yanis}}", p_card_id = "89fb3c15-a103-4b9c-b8b8-d872c7c1b8dc" }
avant = """insert into public.ping_pairs (user_low, user_high) values (least('{{charles}}'::uuid, '{{yanis}}'::uuid), greatest('{{charles}}'::uuid, '{{yanis}}'::uuid)) on conflict (user_low, user_high) do update set last_seen_at = now();
insert into public.connection_requests (sender_id, receiver_id, status, expires_at) values ('{{charles}}', '{{yanis}}', 'pending', now() + interval '7 days');
update public.profiles set suspended_at = now() where id = '{{charles}}'"""
equivalence = "plus_strict"
ecart = "un compte suspendu n'envoie plus rien : la demande en attente ne peut plus porter de Vibe (même trou de l'ancien gardien, autre chemin)"
refus_attendu = "Ton compte est suspendu"

