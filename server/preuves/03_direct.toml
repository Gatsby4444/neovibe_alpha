[[cas]]
nom = "les messages d'une conversation dont je suis membre"
qui = "charles"
op = "direct_instantane"
args = { sujet = "messages:conversation_id=ce573f65-3b61-4df1-995c-3cefc5620c64" }
avant = """insert into public.messages (conversation_id, sender_id, kind, body) values ('ce573f65-3b61-4df1-995c-3cefc5620c64', '{{testeur}}', 'text', 'un');
insert into public.messages (conversation_id, sender_id, kind, body) values ('ce573f65-3b61-4df1-995c-3cefc5620c64', '{{charles}}', 'text', 'deux');
insert into public.hidden_messages (user_id, message_id) select '{{charles}}', id from public.messages where body = 'un' and conversation_id = 'ce573f65-3b61-4df1-995c-3cefc5620c64'"""
ancien_resultat = "select coalesce(json_agg(r order by r.id), '[]') from public.messages r where r.conversation_id = 'ce573f65-3b61-4df1-995c-3cefc5620c64'"

[[cas]]
nom = "les messages d'une conversation étrangère : refusé"
