# Domaine 3 — le direct : l'état d'un sujet à l'abonnement (`direct_instantane`)
# doit être exactement ce que l'ancienne base laissait lire (sa politique
# SELECT), avec le même filtre que l'ancien `.stream()`.

[[cas]]
nom = "mes Vibes reçues"
qui = "charles"
op = "direct_instantane"
args = { sujet = "card_deliveries:recipient_id={{charles}}" }
ancien_resultat = "select coalesce(json_agg(r order by r.id), '[]') from public.card_deliveries r where r.recipient_id = '{{charles}}'"

[[cas]]
nom = "les Vibes reçues d'un autre : refusé"
qui = "charles"
op = "direct_instantane"
args = { sujet = "card_deliveries:recipient_id={{testeur}}" }
ancien_resultat = "select coalesce(json_agg(r order by r.id), '[]') from public.card_deliveries r where r.recipient_id = '{{testeur}}'"
equivalence = "sans_effet"

