# Domaine 7 — Pulse, le fil (docs/serveur-rust.md, annexe A.6).
#
# Mise en place commune des situations du fil (les publications de la copie
# ont plus de 3 jours : on les rajeunit) :
# - Charles a croisé Sofia (ping) → sa publication publique 07a67541… ;
# - Testeur a ajouté au fil de Charles la publication de Léa a68a269b… ;
# - la publication de Chloé ba2a0d29… est localisée à Paris (48,8566 ; 2,3522) ;
# - Yanis (7ace5ce3…) n'est rien pour Charles : jamais dans son fil.

[[cas]]
nom = "mon fil : les trois sources"
qui = "charles"
rpc = "feed_items"
args = { p_kind = "card", p_mode = "all", p_lat = 48.857, p_lng = 2.352 }
avant = """update public.library_items set created_at = now() - interval '1 hour' where id in ('07a67541-95c2-4219-90a3-6f2a2f5936b2', 'a68a269b-ba69-4bf7-b63d-6b7abceccb28', 'ba2a0d29-008c-44f1-9221-0e6be258668f', '7ace5ce3-aed3-4b8f-a83a-da4f83285e6d');
update public.library_items set created_at = now() - interval '2 hours' where id = 'a68a269b-ba69-4bf7-b63d-6b7abceccb28';
update public.library_items set created_at = now() - interval '3 hours' where id = 'ba2a0d29-008c-44f1-9221-0e6be258668f';
insert into public.ping_pairs (user_low, user_high) values (least('{{charles}}'::uuid, '{{sofia}}'::uuid), greatest('{{charles}}'::uuid, '{{sofia}}'::uuid)) on conflict (user_low, user_high) do update set last_seen_at = now();
insert into public.feed_adds (content_id, adder_id, recipient_id) values ('a68a269b-ba69-4bf7-b63d-6b7abceccb28', '{{testeur}}', '{{charles}}');
update public.contents set anchor_lat = 48.8566, anchor_lng = 2.3522 where id = 'ba2a0d29-008c-44f1-9221-0e6be258668f'"""
ancien_resultat = "select coalesce(jsonb_agg(to_jsonb(li) || jsonb_build_object('contents', (select jsonb_build_object('shareable', c.shareable, 'saveable', c.saveable) from public.contents c where c.id = li.id), 'library_media', coalesce((select jsonb_agg(to_jsonb(m) order by m.slot) from public.library_media m where m.item_id = li.id), '[]'::jsonb))), '[]'::jsonb) from public.feed_items(p_kind => 'card', p_mode => 'all', p_lat => 48.857, p_lng => 2.352) li"

